<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Language Key Analysis</title>

  <style>
    /* ================= ROOT COLORS ================= */
    :root {
      --primary: #1b3041;
      --secondary: #5d4037;
      --success: #2e7d32;
      --error: #b00020;
      --bg: #fafafa;
      --surface: #ffffff;
      --text: #212121;
      --muted: #666;
    }

    body.dark-mode {
      --bg: #151627;
      --surface: #212131;
      --text: #e0e0e0;
      --muted: #aaa;
    }

    /* ================= BASE ================= */
    body {
      margin: 0;
      font-family: Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      transition: all .3s;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    main {
      max-width: 900px;
      margin: auto;
      padding: 1rem;
      flex: 1;
    }

    /* ================= HEADER ================= */
    header {
      position: sticky;
      top: 0;
      background: var(--primary);
      color: #fff;
      padding: .8rem 1.2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    header button {
      background: var(--secondary);
      border: none;
      padding: .5rem .9rem;
      color: #fff;
      border-radius: 6px;
      cursor: pointer;
    }

    /* ================= SUMMARY ================= */
    .summary {
      background: var(--surface);
      padding: 1rem;
      border-radius: 10px;
      margin-bottom: 1rem;
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: space-between;
      font-size: .9rem;
    }

    /* ================= SEARCH ================= */
    input[type="search"] {
      width: 100%;
      padding: .6rem;
      border-radius: 6px;
      border: 1px solid #ccc;
      margin-bottom: 1rem;
    }

    /* ================= GROUP ================= */
    .language-group {
      background: var(--surface);
      border-radius: 10px;
      margin-bottom: 1rem;
      padding: .7rem;
    }

    .language-group h3 {
      display: flex;
      justify-content: space-between;
      cursor: pointer;
      user-select: none;
    }

    .language-group ul {
      list-style: none;
      padding-left: 1rem;
      margin-top: .5rem;
    }

    .language-group.collapsed ul {
      display: none;
    }

    li {
      padding: .4rem;
      border-left: 4px solid;
      margin-bottom: .4rem;
      display: flex;
      gap: .5rem;
      align-items: center;
      font-size: .85rem;
    }

    li.missing {
      border-color: var(--error);
      background: #ffdada;
    }

    li.extra {
      border-color: var(--secondary);
      background: #efe7e4;
    }

    li.checked span {
      text-decoration: line-through;
      opacity: .6;
    }

    /* ================= COMPLETE ================= */
    #complete {
      background: #e8f5e9;
      padding: .8rem;
      border-radius: 10px;
      margin-bottom: 1rem;
      font-size: .9rem;
    }

    /* ================= FOOTER ================= */
    footer {
      text-align: center;
      padding: .8rem;
      font-size: .8rem;
      color: var(--muted);
    }
  </style>

  <!-- LOCALES -->
  <script src="../locales/en.js"></script>
  <script src="../locales/hi.js"></script>
  <script src="../locales/fr.js"></script>
  <script src="../locales/es.js"></script>
</head>

<body>
  <header>
    <strong>🌐 Language Key Analysis</strong>
    <button id="themeToggle">Toggle Theme</button>
  </header>

  <main>
    <div class="summary" id="summary"></div>

    <input type="search" id="search" placeholder="Search missing keys..." />

    <div id="complete"></div>
    <div id="results"></div>
  </main>

  <footer>
    Language Consistency Tool • Optimized & Production Ready
  </footer>

  <script>
    /* ================= SAFE LANGUAGE LOADING ================= */
    const languages = { en, hi, fr, es };

    if (!languages.en) {
      alert("English language file is missing!");
      throw new Error("Missing reference language");
    }

    /* ================= THEME ================= */
    const themeToggle = document.getElementById("themeToggle");
    const savedTheme = localStorage.getItem("theme");

    if (savedTheme === "dark") document.body.classList.add("dark-mode");

    themeToggle.onclick = () => {
      document.body.classList.toggle("dark-mode");
      localStorage.setItem(
        "theme",
        document.body.classList.contains("dark-mode") ? "dark" : "light"
      );
    };

    /* ================= ANALYSIS ================= */
    function analyze(ref, langs) {
      const refKeys = Object.keys(langs[ref]);
      const result = {};

      for (const l in langs) {
        if (l === ref) continue;
        const keys = Object.keys(langs[l]);
        result[l] = {
          missing: refKeys.filter(k => !keys.includes(k)),
          extra: keys.filter(k => !refKeys.includes(k))
        };
      }
      return result;
    }

    const analysis = analyze("en", languages);
    const resultsDiv = document.getElementById("results");
    const completeDiv = document.getElementById("complete");
    const summaryDiv = document.getElementById("summary");

    let totalMissing = 0, totalExtra = 0;

    for (const lang in analysis) {
      totalMissing += analysis[lang].missing.length;
      totalExtra += analysis[lang].extra.length;

      if (!analysis[lang].missing.length && !analysis[lang].extra.length) {
        completeDiv.innerHTML += `✔ ${lang.toUpperCase()} is complete<br>`;
        continue;
      }

      const group = document.createElement("div");
      group.className = "language-group collapsed";

      group.innerHTML = `
        <h3>
          ${lang.toUpperCase()}
          <span>Missing ${analysis[lang].missing.length} | Extra ${analysis[lang].extra.length}</span>
        </h3>
        <ul></ul>
      `;

      const ul = group.querySelector("ul");

      analysis[lang].missing.forEach(k => {
        ul.innerHTML += `
          <li class="missing">
            <input type="checkbox">
            <span>${k}</span>
          </li>`;
      });

      analysis[lang].extra.forEach(k => {
        ul.innerHTML += `
          <li class="extra">
            <span>${k}</span>
          </li>`;
      });

      group.querySelector("h3").onclick = () => group.classList.toggle("collapsed");
      resultsDiv.appendChild(group);
    }

    summaryDiv.innerHTML = `
      <div><strong>Total Languages:</strong> ${Object.keys(languages).length}</div>
      <div><strong>Total Missing Keys:</strong> ${totalMissing}</div>
      <div><strong>Total Extra Keys:</strong> ${totalExtra}</div>
    `;

    /* ================= SEARCH ================= */
    document.getElementById("search").addEventListener("input", e => {
      const value = e.target.value.toLowerCase();
      document.querySelectorAll("li.missing").forEach(li => {
        li.style.display = li.textContent.toLowerCase().includes(value) ? "" : "none";
      });
    });

  </script>
</body>
</html>
